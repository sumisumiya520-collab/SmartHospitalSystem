<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .entity { fill: #E8F4FD; stroke: #2E75B6; stroke-width: 2; rx: 8; }
      .entity-header { fill: #2E75B6; }
      .attr { font-size: 13px; fill: #333; }
      .pk { font-weight: bold; fill: #C0392B; }
      .fk { fill: #7D3C98; font-style: italic; }
      .rel { stroke: #E74C3C; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .rel-label { font-size: 12px; fill: #E74C3C; font-weight: bold; }
      .title { font-size: 20px; font-weight: bold; fill: #1F3864; }
      .subtitle { font-size: 13px; fill: #666; }
      .diamond { fill: #F9E79F; stroke: #D4AC0D; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#FAFAFA" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">Entity-Relationship (ER) Diagram</text>
  <text x="450" y="55" text-anchor="middle" class="subtitle">Smart Hospital Patient Monitoring &amp; Bed Allocation System</text>

  <!-- ===== PATIENTS Entity ===== -->
  <rect x="40" y="100" width="220" height="240" class="entity"/>
  <rect x="40" y="100" width="220" height="36" class="entity-header" rx="8"/>
  <rect x="40" y="128" width="220" height="8" fill="#E8F4FD"/>
  <text x="150" y="125" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Patients</text>
  <text x="55" y="158" class="attr"><tspan class="pk">PK</tspan>  PatientID (UUID)</text>
  <text x="55" y="180" class="attr">      PatientName (NVARCHAR)</text>
  <text x="55" y="200" class="attr">      Age (INT)</text>
  <text x="55" y="220" class="attr">      DiseaseCategory (NVARCHAR)</text>
  <text x="55" y="240" class="attr">      Temperature (FLOAT)</text>
  <text x="55" y="260" class="attr">      PulseRate (INT)</text>
  <text x="55" y="280" class="attr">      OxygenLevel (FLOAT)</text>
  <text x="55" y="300" class="attr">      IsCritical (BOOLEAN)</text>
  <text x="55" y="320" class="attr"><tspan class="fk">FK</tspan>  AssignedBedID (UUID)</text>

  <!-- ===== BEDS Entity ===== -->
  <rect x="340" y="100" width="220" height="200" class="entity"/>
  <rect x="340" y="100" width="220" height="36" class="entity-header" rx="8"/>
  <rect x="340" y="128" width="220" height="8" fill="#E8F4FD"/>
  <text x="450" y="125" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Beds</text>
  <text x="355" y="158" class="attr"><tspan class="pk">PK</tspan>  BedID (UUID)</text>
  <text x="355" y="180" class="attr">      WardName (NVARCHAR)</text>
  <text x="355" y="200" class="attr">      BedType (ENUM: General/ICU)</text>
  <text x="355" y="220" class="attr">      IsOccupied (BOOLEAN)</text>
  <text x="355" y="240" class="attr">      LastSanitized (TIMESTAMP)</text>

  <!-- ===== ALERTS Entity ===== -->
  <rect x="640" y="100" width="220" height="180" class="entity"/>
  <rect x="640" y="100" width="220" height="36" class="entity-header" rx="8"/>
  <rect x="640" y="128" width="220" height="8" fill="#E8F4FD"/>
  <text x="750" y="125" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Alerts</text>
  <text x="655" y="158" class="attr"><tspan class="pk">PK</tspan>  AlertID (UUID)</text>
  <text x="655" y="180" class="attr">      Timestamp (TIMESTAMP)</text>
  <text x="655" y="200" class="attr">      Type (ENUM: 4 types)</text>
  <text x="655" y="220" class="attr">      Message (TEXT)</text>

  <!-- ===== Relationship: Patients -> Beds ===== -->
  <line x1="260" y1="310" x2="340" y2="260" class="rel"/>
  <!-- Diamond -->
  <polygon points="300,275 315,290 300,305 285,290" class="diamond"/>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#333">assigned</text>

  <!-- Relationship labels -->
  <text x="270" y="270" class="rel-label">1</text>
  <text x="330" y="270" class="rel-label">0..1</text>

  <!-- ===== Relationship: Patients -> Alerts (event-driven) ===== -->
  <path d="M260 200 Q300 380 640 200" class="rel" stroke-dasharray="6,3"/>
  <text x="430" y="380" text-anchor="middle" class="rel-label" fill="#7D3C98">generates</text>
  <text x="430" y="396" text-anchor="middle" font-size="11" fill="#999">(via events)</text>

  <!-- ===== ENUM: AlertType ===== -->
  <rect x="640" y="420" width="220" height="140" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5" rx="8"/>
  <text x="750" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#E67E22">AlertType (ENUM)</text>
  <text x="655" y="468" class="attr">0  CriticalVital</text>
  <text x="655" y="488" class="attr">1  BedAllocated</text>
  <text x="655" y="508" class="attr">2  AllocationFailed</text>
  <text x="655" y="528" class="attr">3  SanitationOverdue</text>

  <!-- ===== ENUM: BedType ===== -->
  <rect x="40" y="420" width="220" height="100" fill="#FFF3E0" stroke="#E67E22" stroke-width="1.5" rx="8"/>
  <text x="150" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#E67E22">BedType (ENUM)</text>
  <text x="55" y="468" class="attr">0  General</text>
  <text x="55" y="488" class="attr">1  ICU</text>

  <!-- Legend -->
  <rect x="340" y="470" width="220" height="90" fill="#F8F9FA" stroke="#DDD" stroke-width="1" rx="6"/>
  <text x="450" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Legend</text>
  <text x="355" y="508" font-size="11" fill="#C0392B">PK = Primary Key</text>
  <text x="355" y="524" font-size="11" fill="#7D3C98">FK = Foreign Key</text>
  <text x="355" y="540" font-size="11" fill="#E74C3C">--- = Event-driven relationship</text>
</svg>
